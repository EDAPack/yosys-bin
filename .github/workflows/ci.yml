# RELEASE PATH -- read this before changing the `uses:` below.
#
# This repo does not publish anything itself. Its release pipeline is
# edapack/edapack-common's reusable build-release workflow, and the gating lives
# there: a `gate` job resolves the release-authority switch at
# https://dvkit.org/.well-known/release-authority.json and the publish job
# requires both `authority == 'github'` and an event that is not a push. That
# last clause is what makes this repo safe to mirror -- since 2026-08-31 its
# history moves between Forgejo and GitHub on a five-minute cron, and git-sync
# produces exactly one kind of event, a push.
#
# THE PIN IS NOT IMMUTABLE. `@v1` is an actions/checkout@v4-style major-version
# alias that edapack-common retargets forward, so it currently points at the tip
# of that repo's `main`. Changing it -- or edapack-common moving it -- changes
# this repo's release behaviour with no commit here.
#
# This block is also load-bearing for the sync itself, which is worth knowing
# before deleting it as boilerplate. git-sync's inbound publish preflight reads
# workflow files as TEXT and cannot follow a `uses:` into another repository, so
# it sees a reference to a release pipeline and no evidence of a gate, and
# refuses to pull the ref. Naming the switch here is how this file states the
# thing the scanner is actually asking about; the gate really is on, it is just
# one repository away. There is a counterpart check in
# .forgejo/workflows/ci.yml that asserts the pin still resolves.

name: CI
# Thin caller of the shared edapack build pipeline. Build/release logic lives in
# edapack-common; input components are declared in build-inputs.yaml.
# See https://edapack.github.io (Developer Guide).
#
# NOTE: previous bespoke workflow archived under .github/workflows-legacy/ci.yml.
# Windows (x64) coverage from that workflow is a tracked follow-up. yosys builds
# the 2_28/2_34 matrix (manylinux2014's bison 3.0.4 is too old for yosys).
on:
  push:
  schedule:
    - cron: "0 12 * * 0"   # Sunday 12:00 UTC — publishes only if inputs changed
  workflow_dispatch:
    inputs:
      core_ref:
        description: "Build a specific Yosys ref (tag/branch/sha), e.g. v0.50"
        type: string
      input_overrides:
        description: 'JSON map of dependency overrides, e.g. {"sv2v":"v0.0.12"}'
        type: string
        default: "{}"
      force:
        description: "Build even if inputs are unchanged"
        type: boolean
        default: false
      prerelease:
        description: "Mark the release as prerelease"
        type: boolean
        default: true

jobs:
  build:
    uses: edapack/edapack-common/.github/workflows/build-release.yml@v1
    with:
      package: yosys-bin
      images: '["manylinux_2_28_x86_64","manylinux_2_34_x86_64"]'
      core_ref: ${{ inputs.core_ref || '' }}
      input_overrides: ${{ inputs.input_overrides || '{}' }}
      force: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
      prerelease: ${{ github.event_name != 'workflow_dispatch' || inputs.prerelease }}
