name: CI
on:
  push:
  workflow_dispatch:
  schedule:
    # Every Sunday at 12PM UTC
    - cron: "0 12 * * 0"

jobs:
    # Resolve the latest Yosys tag once and share it with all build jobs.
    version:
        runs-on: 'ubuntu-latest'
        outputs:
            yosys_version: ${{ steps.is_needed.outputs.yosys_version }}
            yosys_latest_rls: ${{ steps.is_needed.outputs.yosys_latest_rls }}
        steps:
            - name: check_is_needed
              id: is_needed
              env:
                BUILD_NUM: ${{ github.run_id }}
              run: |
                yosys_latest_rls=$(curl -s -L \
                    -H "Accept: application/vnd.github+json" \
                    -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                    -H "X-GitHub-Api-Version: 2022-11-28" \
                    https://api.github.com/repos/YosysHQ/yosys/git/refs/tags | \
                    jq ".[].ref" | sed -e's%refs/tags/%%' -e 's/\"//g'| sort | tail -n 1)
                echo "yosys_latest_rls: ${yosys_latest_rls}"
                yosys_version=$(echo $yosys_latest_rls | sed -e 's/^v//')

                echo "yosys_latest_rls=${yosys_latest_rls}" >> ${GITHUB_OUTPUT}
                echo "yosys_version=${yosys_version}.${BUILD_NUM}" >> ${GITHUB_OUTPUT}

    build-linux:
        needs: version
        runs-on: 'ubuntu-latest'
        strategy:
            matrix:
                image:
                    - manylinux_2_28_x86_64
                    - manylinux_2_34_x86_64
        steps:
            - uses: actions/checkout@v4
              with:
                submodules: false
            - name: build
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                BUILD_NUM: ${{ github.run_id }}
                CI_BUILD: 1
                image: ${{ matrix.image }}
                yosys_version: ${{ needs.version.outputs.yosys_version }}
              run: >
                docker run --rm
                --volume "$(pwd):/io"
                --env BUILD_NUM
                --env CI_BUILD
                --env image
                --env yosys_version
                --workdir /io
                quay.io/pypa/${{ matrix.image }}
                /io/scripts/build.sh
            - name: Upload build artifact
              uses: actions/upload-artifact@v4
              with:
                name: yosys-${{ matrix.image }}
                path: release/*.tar.gz
                if-no-files-found: error
                retention-days: 7

    # ── Generate Visual Studio source package (Linux) ─────────────────────────
    # Runs make vcxsrc inside yosys to produce a zip of the VS project.
    # The result is uploaded as an artifact for the Windows build job.
    vcxsrc:
        needs: version
        runs-on: 'ubuntu-latest'
        steps:
            - uses: actions/checkout@v4
              with:
                submodules: false
            - name: Clone yosys
              run: |
                git clone https://github.com/YosysHQ/yosys yosys
                cd yosys && git submodule update --init
            - name: Install build tools
              run: sudo apt-get update -qq && sudo apt-get install -y flex bison libfl-dev zip cpp
            - name: Generate VS source package
              run: |
                cd yosys
                make vcxsrc VCX_DIR_NAME=yosys-win32-vcxsrc
            - name: Upload vcxsrc artifact
              uses: actions/upload-artifact@v4
              with:
                name: yosys-vcxsrc
                path: yosys/yosys-win32-vcxsrc.zip

    # ── Windows build (MSVC via MSBuild) ──────────────────────────────────────
    build-windows:
        needs: [version, vcxsrc]
        runs-on: 'windows-latest'
        steps:
            - uses: actions/checkout@v4
              with:
                submodules: false
            - uses: microsoft/setup-msbuild@v2
            - name: Download vcxsrc artifact
              uses: actions/download-artifact@v4
              with:
                name: yosys-vcxsrc
                path: .
            - name: Build and package
              env:
                yosys_version: ${{ needs.version.outputs.yosys_version }}
              shell: pwsh
              run: scripts\build-windows.ps1
            - name: Upload Windows artifact
              uses: actions/upload-artifact@v4
              with:
                name: release-windows
                path: release/*.zip

    # ── Release ───────────────────────────────────────────────────────────────
    release:
        needs: [version, build-linux, build-windows]
        runs-on: 'ubuntu-latest'
        steps:
            - name: Download Linux artifacts
              uses: actions/download-artifact@v4
              with:
                pattern: yosys-manylinux*
                path: artifacts
                merge-multiple: true
            - name: Download Windows artifact
              uses: actions/download-artifact@v4
              with:
                name: release-windows
                path: artifacts
            - name: Create Release
              id: create_release
              uses: actions/create-release@v1
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                tag_name: "v${{ needs.version.outputs.yosys_version }}"
                release_name: "Release ${{ needs.version.outputs.yosys_version }}"
                body: |
                  Build of Yosys ${{ needs.version.outputs.yosys_version }}
                draft: false
                prerelease: false
            - name: Upload release assets
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                upload_url=$(echo "${{ steps.create_release.outputs.upload_url }}" | sed 's/{?name,label}//')
                for f in artifacts/*.zip artifacts/*.tar.gz; do
                  [ -f "$f" ] || continue
                  name=$(basename "$f")
                  case "$f" in
                    *.zip)     content_type="application/zip" ;;
                    *.tar.gz)  content_type="application/gzip" ;;
                  esac
                  curl -s -L \
                    -X POST \
                    -H "Accept: application/vnd.github+json" \
                    -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                    -H "X-GitHub-Api-Version: 2022-11-28" \
                    -H "Content-Type: ${content_type}" \
                    --data-binary "@${f}" \
                    "${upload_url}?name=${name}" \
                    | jq -r '.name // .message'
                done
