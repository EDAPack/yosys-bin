# Docs build for edapack/yosys-bin on Forgejo Actions.
#
# THIS IS THE ONLY THING THAT PUBLISHES THESE DOCS. .github/workflows/docs.yml
# still builds them, as a CI check, but its Pages deploy was deleted on
# 2026-08-31. dvkit.org owns all documentation: <org>.github.io lands at
# dvkit.org/<org>/, and a repo's docs land at dvkit.org/<org>/<repo>/. dvkit.org
# is a single Cloudflare Pages project and a deploy replaces the WHOLE site, so
# there is exactly one publisher for it.
#
# What happens after this job, all of it host-side:
#
#   docs-fetch edapack/yosys-bin main   # artifact -> staging/
#   docs-promote / docs-deploy   # -> dvkit.org/edapack/yosys-bin/
#
# The built HTML leaves as an ARTIFACT and nothing else. This job holds no
# Cloudflare token and mounts nothing: a workflow file is public and editable by
# anyone who can push, and the deploy credential is account-scoped.
#
# THIS DIRECTORY ALSO DISARMS .github/workflows/. The Forgejo runner falls back
# to .github/workflows/ only when .forgejo/workflows/ is ABSENT -- a
# directory-level decision, not a per-file one -- so the presence of this file
# is part of what stops the runner attempting the GitHub build. That build
# `docker run`s a stock manylinux image to compile an EDA tool from source, and
# there is no Docker daemon on this runner: it would fail on the first step for
# reasons about the runner rather than about the code, and people would stop
# reading it.
#
# Constraints this file is shaped by, all measured on this instance:
#
#  1. No third-party actions. A bare `uses:` resolves against code.forgejo.org
#     (Forgejo's DEFAULT_ACTIONS_URL), not github.com, so actions/setup-python
#     does not exist here. `ubuntu-latest` maps to catthehacker/ubuntu:act-22.04,
#     which carries Python 3.10 -- enough for Sphinx 7.
#  2. `python` unqualified DOES NOT EXIST in that image. Use python3.
#  3. NO release-authority gate. That switch decides who publishes PACKAGES.
#     Docs are not a release: they publish from Forgejo to dvkit.org
#     unconditionally, whichever side holds release authority. Adding the gate
#     here would silently stop docs whenever the switch said "github".
#  4. The artifact name is the `docs-<org>-<repo>` convention docs-fetch matches
#     on, and `path: .../**` makes the build directory the ZIP ROOT --
#     docs-fetch refuses an artifact with no index.html at the top level.

name: Docs

on:
  - push
  - pull_request
  - workflow_dispatch

jobs:
  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check for internal identifiers in tracked files
        # This repo is published to git.dvkit.org and mirrored to GitHub, so
        # anything committed here is public. Internal host names, tailnet
        # addresses and CGNAT-range IPs must not appear in tracked files -- if a
        # build ever needs one, it belongs in a repository secret, which is
        # masked in logs.
        run: |
          pattern='perch-char\.ts\.net|\.ts\.net|a9550|100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.[0-9]+\.[0-9]+'
          if git grep -nIE "$pattern" -- . ':!.forgejo/workflows/docs.yml' ; then
            echo "::error::internal identifier found in a tracked file (see matches above)"
            exit 1
          fi
          echo "OK: no internal identifiers in tracked files"

      - name: Install doc dependencies
        # pip in this image is 22.0.2 and predates PEP 660. Nothing here needs
        # an editable install, but the upgrade is cheap and keeps a future one
        # from failing in a way that reads as a docs problem.
        #
        # --break-system-packages is a FALLBACK, not the first attempt. Some
        # rebuilds of catthehacker/ubuntu:act-22.04 mark the interpreter
        # externally-managed (PEP 668), at which point a plain `pip install`
        # exits 1 with a wall of text about virtual environments and the failure
        # reads as a docs problem rather than an image problem. There is nothing
        # to protect here -- the container is discarded at the end of the job.
        run: |
          pip_install() {
            python3 -m pip install -q "$@" && return 0
            python3 -m pip install -q --break-system-packages "$@"
          }
          pip_install --upgrade pip setuptools wheel
          pip_install -r docs/requirements.txt

      - name: Build HTML docs
        # Matches what .github/workflows/docs.yml builds, so the CI check and
        # the thing that actually ships cannot disagree about the doc set.
        run: python3 -m sphinx -b html docs docs/_build/html

      - name: Sanity-check the build
        # Sphinx exits 0 on a build that produced almost nothing, and an empty
        # doc set is worse than a failed one because it deploys.
        run: |
          test -s docs/_build/html/index.html \
            || { echo "::error::no index.html in the build output"; exit 1; }
          n=$(find docs/_build/html -name '*.html' | wc -l)
          echo "generated pages: $n"
          # 6 source files in docs/ today, plus genindex/search. The
          # floor is set below that on purpose -- it is here to catch a
          # collapsed build, not to fail when a page is removed.
          [ "$n" -ge 5 ] || { echo "::error::only $n pages built; docs/ carries 6 sources. Refusing to call this a doc set."; exit 1; }

      - name: Upload docs
        # Consumed by the host-side poller:
        #   docs-fetch edapack/yosys-bin main
        # Note the explicit branch -- docs-fetch defaults to `master`.
        uses: forgejo/upload-artifact@v4
        with:
          name: docs-edapack-yosys-bin
          path: docs/_build/html/**
          if-no-files-found: error
