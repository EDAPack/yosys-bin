package:
  name: yosys-bin

  # CI (edapack-common's build-release pipeline) runs `ivpm update` with no
  # explicit dep-set, which resolves the default. Pin that to default-dev so the
  # build tooling (edapack-common) is fetched, while the `default` dep-set below
  # stays a lean set of runtime Python deps for consumers of a release.
  default-dep-set: default-dev

  # When installed from a release tarball, prepend the bundled yosys binaries
  # to PATH so downstream tasks can invoke `yosys` directly.
  env:
  - name: PATH
    path-prepend: "${IVPM_PACKAGES}/yosys-bin/bin"

  dep-sets:
  # Runtime Python dependencies required by Yosys/sby (sby needs click).
  - name: default
    deps:
    - name: click
      src: pypi

  # Developer/CI set: build tooling and tool sources, plus the runtime deps.
  - name: default-dev
    deps:
    - name: edapack-common
      url: https://github.com/edapack/edapack-common.git
    - name: dv-flow-mgr
      url: https://github.com/dv-flow/dv-flow-mgr.git
    - name: yosys
      url: https://github.com/YosysHQ/yosys.git
      type: raw
    - name: sby
      url: https://github.com/YosysHQ/sby.git
      type: raw
    - name: mcy
      url: https://github.com/YosysHQ/mcy.git
      type: raw
    - name: eqy
      url: https://github.com/YosysHQ/eqy.git
      type: raw
    - name: click
      src: pypi
